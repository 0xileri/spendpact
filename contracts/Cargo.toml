[workspace]
resolver = "2"
members = ["spact-vault", "mock-ft", "integration-tests"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[workspace.dependencies]
near-sdk = "=5.29.1"
near-contract-standards = "=5.29.1"
near-workspaces = "=0.23.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
anyhow = "1"
serde_json = "1"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
