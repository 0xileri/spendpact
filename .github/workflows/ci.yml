name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v6
      # installs the toolchain and wasm target pinned in contracts/rust-toolchain.toml
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ../scripts/test-contracts.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: rustup show active-toolchain || rustup toolchain install
        working-directory: contracts
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @spact/web exec playwright install --with-deps chromium
      # local sandbox chain + dev signer + approval page, driven by Chromium
      - run: pnpm e2e
      # the agent's MCP server over stdio, against its own sandbox chain
      - run: pnpm mcp:sandbox
      # the Telegram notifier against its own sandbox chain and a mock Bot API
      - run: pnpm notifier:sandbox
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results/
